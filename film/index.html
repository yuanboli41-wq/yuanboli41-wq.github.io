/* Layout: 放映厅。整屏动态开场 → 片名名单（悬停看画面）→ 代表作虚化特写 → 关于 → 联系。单一深色，颜色只来自画面 */
:root{
  --bg:#0D0C0B;
  --bg-2:#141210;
  --ink:#EDE8E0;
  --ink-2:rgba(237,232,224,.64);
  --ink-3:rgba(237,232,224,.38);
  --rule:rgba(237,232,224,.13);
  --light:#F6F1E8;
  --display:"ZX Serif","Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  --latin:"Instrument Serif","Times New Roman",Georgia,serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --gutter:max(clamp(16px,4.2vw,64px),env(safe-area-inset-left,0px));
  --gutter-r:max(clamp(16px,4.2vw,64px),env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--light);outline-offset:4px}
.in{max-width:1360px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter-r)}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:12px;letter-spacing:.28em;color:var(--ink-3);padding-bottom:16px;border-bottom:1px solid var(--rule)}
.label .n{font-family:var(--latin);font-style:italic;font-size:16px;letter-spacing:.01em;color:var(--ink-2)}

/* ---------- 开场 ---------- */
.hero{position:relative;height:min(100svh,940px);min-height:560px;overflow:hidden;background:#000;color:var(--light)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,7,6,.6) 0%,rgba(8,7,6,0) 20%,rgba(8,7,6,0) 42%,rgba(8,7,6,.86) 100%)}
.hero .in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding-block:22px clamp(26px,4vw,52px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;font-size:13px;letter-spacing:.08em}
.mark{display:flex;align-items:baseline;gap:12px}
.mark b{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.14em}
.mark span{font-size:11px;color:rgba(246,241,232,.5);letter-spacing:.12em}
.bar nav{display:flex;gap:clamp(18px,3vw,40px)}
.bar nav a{text-decoration:none;color:rgba(246,241,232,.72)}
.bar nav a:hover{color:var(--light)}
.hero-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:28px 48px}
.hero-name{font-family:var(--display);font-weight:900;font-size:clamp(4.4rem,15.5vw,13rem);line-height:.9;letter-spacing:.03em;margin:0;text-shadow:0 4px 60px rgba(0,0,0,.35)}
.hero-sub{margin-top:clamp(14px,2vw,24px);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 20px;font-size:14px;letter-spacing:.1em;color:rgba(246,241,232,.74)}
.hero-sub i{font-family:var(--latin);font-size:19px;letter-spacing:.01em;color:var(--light)}
.now{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:10px;min-width:220px}
.now-k{font-size:11px;letter-spacing:.3em;color:rgba(246,241,232,.5)}
.now-t{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.2;letter-spacing:.04em}
.now-m{font-family:var(--latin);font-style:italic;font-size:18px;color:rgba(246,241,232,.72);line-height:1.2}
.segs{display:flex;gap:6px;width:100%;max-width:240px}
.segs span{flex:1;height:2px;background:rgba(246,241,232,.22);overflow:hidden}
.segs span i{display:block;height:100%;background:var(--light);transform-origin:left;transform:scaleX(0)}
.reel-btn{margin-top:8px;display:inline-flex;align-items:center;gap:12px;background:rgba(246,241,232,.08);border:1px solid rgba(246,241,232,.32);border-radius:999px;padding:7px 18px 7px 7px;cursor:pointer;font-size:14px;letter-spacing:.06em;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background .25s}
.reel-btn:hover{background:rgba(246,241,232,.18)}
.reel-btn .dot{width:32px;height:32px;border-radius:50%;background:var(--light);color:#0D0C0B;display:grid;place-items:center}
.reel-btn svg{width:10px;height:10px;margin-left:2px}
.reel-btn em{font-family:var(--latin);font-size:16px;color:rgba(246,241,232,.7)}

/* ---------- 作品名单 ---------- */
.works{padding-block:clamp(80px,11vw,150px) 0}
.index{list-style:none;margin:0;padding:0}
.row{border-bottom:1px solid var(--rule)}
.row-btn{appearance:none;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;width:100%;
  display:grid;grid-template-columns:minmax(0,1fr) 140px 130px 120px;grid-template-areas:"head type role time";
  align-items:center;gap:10px 28px;padding-block:clamp(22px,2.8vw,38px);transition:opacity .4s}
@media (hover:hover){
  .index:hover .row-btn{opacity:.26}
  .index .row-btn:hover,.index .row-btn:focus-visible{opacity:1}
}
.r-head{grid-area:head;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 22px;min-width:0}
.r-title{font-family:var(--display);font-weight:900;font-size:clamp(2.3rem,6.4vw,5.6rem);line-height:1.08;letter-spacing:.04em}
.r-en{font-family:var(--latin);font-style:italic;font-size:clamp(1.05rem,1.7vw,1.45rem);color:var(--ink-2)}
.r-type{grid-area:type;font-size:13px;color:var(--ink-2);letter-spacing:.08em;line-height:1.5}
.r-type small{display:block;font-family:var(--latin);font-size:15px;letter-spacing:.02em;color:var(--ink-3)}
.r-role{grid-area:role;font-size:13px;color:var(--ink-2);letter-spacing:.08em}
.r-time{grid-area:time;font-family:var(--latin);font-size:clamp(1.4rem,2.1vw,1.9rem);text-align:right;font-variant-numeric:tabular-nums}
.thumb{grid-area:thumb;display:none;position:relative;aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

const toSec = (t) => t.split(":").map(Number).reduce((a, n) => a * 60 + n, 0);

function rng(seed) { let t = (seed * 7919) % 233280; return () => (t = (t * 9301 + 49297) % 233280) / 233280; }
function grainTile(a) {

  }
  if (s.skyline) {
    /* 远景一层（淡、虚）+ 近景一层（实），窗光带一点光晕，像长焦镜头里的城市 */
    const layers = [
      { hk: .62, alpha: .5, blur: 4 * u, lit: s.lit * .7, ws: .7 },

      let x = -10;

    const bg = c.createLinearGradient(tx, top, tx - W * .55, top);
    bg.addColorStop(0, "rgba(255,226,170,.55)"); bg.addColorStop(1, "rgba(255,226,170,0)");
    c.fillStyle = bg; c.beginPath(); c.moveTo(tx, top - 7 * u); c.lineTo(tx - W * .58, top - 70 * u); c.lineTo(tx - W * .58, top + 40 * u); c.fill();
    c.fillStyle = "#FFE2AA"; c.fillRect(tx - 5 * u, top - 11 * u, 10 * u, 7 * u);
    c.fillStyle = "#0A111F"; c.fillRect(0, hy - 6 * u, W * .42, 8 * u);
  }
  if (s.special === "store") {
    const sx = W * .35, sw = W * .3, sy = hy - H * .38, sh = H * .38, lg = c.createLinearGradient(0, sy, 0, sy + sh);
    lg.addColorStop(0, "#E8FBEF"); lg.addColorStop(1, "#ABDABF"); c.fillStyle = lg; c.fillRect(sx, sy, sw, sh);
    c.fillStyle = "rgba(40,80,60,.35)"; for (let k = 1; k < 4; k++) c.fillRect(sx + 10 * u, sy + sh * k / 4, sw * .55, 3 * u);
    c.fillStyle = "#0B130F"; c.fillRect(sx + sw * .72, sy + sh * .42, 18 * u, sh * .58);
    c.beginPath(); c.arc(sx + sw * .72 + 9 * u, sy + sh * .36, 11 * u, 0, Math.PI * 2); c.fill();
    const sp = c.createLinearGradient(0, hy, 0, H); sp.addColorStop(0, "rgba(190,232,207,.34)"); sp.addColorStop(1, "rgba(190,232,207,0)");
    c.fillStyle = sp; c.beginPath(); c.moveTo(sx, hy); c.lineTo(sx + sw, hy); c.lineTo(sx + sw + 140 * u, H); c.lineTo(sx - 140 * u, H); c.fill();
  }
  if (s.fog) {
    const fg = c.createLinearGradient(0, hy - H * .3, 0, hy + H * .14);
    fg.addColorStop(0, "rgba(0,0,0,0)"); fg.addColorStop(.65, s.fog); fg.addColorStop(1, "rgba(0,0,0,0)"); c.fillStyle = fg; c.fillRect(0, 0, W, H);
  }
  const v = c.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .7);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.62)"); c.fillStyle = v; c.fillRect(0, 0, W, H);
  c.globalAlpha = .06; c.fillStyle = c.createPattern(GRAIN[seed % 4], "repeat"); c.fillRect(0, 0, W, H); c.globalAlpha = 1;
}

/* 每部作品的画面源：有 cover 用图片，否则用示意画面 */
const STILLS = SITE.works.map((w, i) => {
  const cv = document.createElement("canvas"); cv.width = 1600; cv.height = 900;
  if (w.cover) {
    const img = new Image();
    img.onload = () => { coverDraw(cv.getContext("2d"), img, 1600, 900, 1); redrawStatic(); };
    img.src = w.cover;
  } else drawScene(cv, w.scene, i + 2);
  return cv;
});
function coverDraw(ctx, img, W, H, scale, panX = 0) {
  const ir = img.width / img.height, cr = W / H;
  let w, h; if (cr > ir) { w = W; h = W / ir; } else { h = H; w = H * ir; }
  w *= scale; h *= scale; ctx.drawImage(img, (W - w) / 2 + panX * W, (H - h) / 2, w, h);
}

/* ---------- 文字内容 ---------- */
$("s-mark").textContent = SITE.name;
$("s-name").textContent = SITE.name;
$("s-sub").innerHTML = `<span>${SITE.roles}</span><i>${SITE.enRoles}</i><span>${SITE.city}</span>`;
$("reel-len").textContent = dur(SITE.showreel.runtime);
$("s-statement").innerHTML = SITE.statement;
$("s-facts").innerHTML = SITE.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
$("s-skills").innerHTML = SITE.skills.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
$("s-cv").innerHTML = SITE.cv.map(([y, w, r]) => `<li><span class="y">${y}</span><span>${w}<span class="r">${r}</span></span></li>`).join("");
$("mail").textContent = SITE.email;
$("c-list").innerHTML = SITE.contact.map(([k, v], i) =>
  `<div class="c-item"><span class="k">${k}</span><span class="v" id="cv-${i}">${v}</span><button class="copy" type="button" data-copy="${v}">复制</button></div>`).join("");
$("s-copy").textContent = `© ${new Date().getFullYear()} ${SITE.name} · 样板网站，人物和作品均为示例`;
const total = SITE.works.reduce((a, w) => a + toSec(w.runtime), 0);
$("works-sum").textContent = `${SITE.works.length} works · ${Math.round(total / 60)} min`;

/* ---------- 作品名单 ---------- */
const index = $("index");
SITE.works.forEach((w, i) => {
  const li = document.createElement("li"); li.className = "row";
  li.innerHTML = `<button class="row-btn" type="button" aria-label="播放《${w.title}》，${w.type}，${w.year}">
      <span class="thumb"><canvas width="640" height="360" aria-hidden="true"></canvas></span>
      <span class="r-head"><span class="r-title">${w.title}</span><span class="r-en">${w.en}</span></span>
      <span class="r-type">${w.type}<small>${w.year}</small></span>
      <span class="r-role">${w.role}</span>
      <span class="r-time">${dur(w.runtime)}</span>
    </button>`;
  index.appendChild(li);
  const b = li.querySelector(".row-btn");
  b.addEventListener("click", () => openPlayer(w));
  b.addEventListener("mouseenter", () => showPeek(i));
  b.addEventListener("focus", () => showPeek(i, b));
  b.addEventListener("blur", hidePeek);
});
index.addEventListener("mouseleave", hidePeek);

/* 跟随鼠标的预览画面（只在有鼠标的设备上） */
const peek = $("peek"), pctx = $("peek-cv").getContext("2d");
const finePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;
let px = -999, py = -999, tx = -999, ty = -999, peekOn = false;
function showPeek(i, anchor) {
  if (!finePointer) return;
  pctx.drawImage(STILLS[i], 0, 0, 640, 360);
  $("peek-t").textContent = SITE.works[i].en;
  if (anchor) { const rc = anchor.getBoundingClientRect(); tx = px = rc.left + rc.width * .62; ty = py = rc.top + rc.height / 2; }
  peekOn = true; peek.classList.add("on");
}
function hidePeek() { peekOn = false; peek.classList.remove("on"); }
if (finePointer) {
  addEventListener("mousemove", (e) => { tx = e.clientX + 30; ty = e.clientY; if (px < -900) { px = tx; py = ty; } });
  const follow = () => {
    const k = reduce ? 1 : .16; px += (tx - px) * k; py += (ty - py) * k;
    peek.style.setProperty("--x", px + "px"); peek.style.setProperty("--y", py + "px");
    requestAnimationFrame(follow);
  };
  requestAnimationFrame(follow);
}

/* ---------- 代表作 ---------- */
const F = SITE.works[SITE.feature] || SITE.works[0];
$("f-k").textContent = `代表作 · ${F.type} · ${F.year}`;
$("f-title").textContent = F.title;
$("f-en").textContent = F.en;
$("f-log").textContent = F.log;
$("f-ratio").textContent = F.ratio;
$("f-credits").innerHTML = (F.credits || [["职务", F.role]]).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")
  + `<dt>时长</dt><dd class="lat">${dur(F.runtime)}</dd><dt>画幅</dt><dd class="lat">${F.ratio}</dd>`;
if (F.award) $("f-award").innerHTML = `<b>${F.award[0]}</b><span>${F.award[1]}</span>`; else $("f-award").hidden = true;
$("f-frame").setAttribute("aria-label", `播放《${F.title}》`);
$("f-frame").addEventListener("click", () => openPlayer(F));

/* ---------- 静态画面绘制（缩略图、代表作） ---------- */
function redrawStatic() {
  index.querySelectorAll(".thumb canvas").forEach((cv, i) => cv.getContext("2d").drawImage(STILLS[i], 0, 0, 640, 360));
  const fi = SITE.works.indexOf(F);
  coverDraw($("f-cv").getContext("2d"), STILLS[fi], 1434, 600, 1);
  $("f-bg").getContext("2d").drawImage(STILLS[fi], 0, 0, 320, 180);
}
redrawStatic();

/* ---------- 开场：轮播各作品画面，缓慢推镜 + 动态颗粒 ---------- */
const reel = $("reel"), rc = reel.getContext("2d"), N = STILLS.length, DUR = 6500, FADE = 1400;
const segs = $("segs");
segs.innerHTML = SITE.works.map(() => "<span><i></i></span>").join("");
const segBars = [...segs.querySelectorAll("i")];
let rw = 0, rh = 0, cur = -1, t0 = performance.now(), running = false, pausedAt = 0;
const grainPats = GRAIN.map(g => rc.createPattern(g, "repeat"));
function sizeReel() {
  const d = Math.min(devicePixelRatio || 1, 1.5);
  rw = reel.width = Math.max(1, Math.round(reel.clientWidth * d));
  rh = reel.height = Math.max(1, Math.round(reel.clientHeight * d));
}
function setNow(i) {
  const w = SITE.works[i];
  $("now-t").textContent = `《${w.title}》`;
  $("now-m").textContent = `${w.en} · ${dur(w.runtime)}`;
}
const FIRST = Math.min(2, N - 1); /* 开场从最有氛围的一部开始放 */
function paint(now) {
  const el = now - t0, idx = (Math.floor(el / DUR) + FIRST) % N, local = el % DUR, p = local / DUR;
  if (idx !== cur) { cur = idx; setNow(idx); }
  const dir = idx % 2 ? 1 : -1;
  rc.globalAlpha = 1; coverDraw(rc, STILLS[idx], rw, rh, 1.03 + .08 * p, dir * (p - .5) * .025);
  if (local > DUR - FADE) {
    rc.globalAlpha = (local - (DUR - FADE)) / FADE;
    const nx = (idx + 1) % N; coverDraw(rc, STILLS[nx], rw, rh, 1.03, (nx % 2 ? 1 : -1) * -.0125);
  }
  rc.globalAlpha = .085; rc.fillStyle = grainPats[Math.floor(now / 84) % 4]; rc.fillRect(0, 0, rw, rh); rc.globalAlpha = 1;
  const pos = Math.floor(el / DUR) % N;
  segBars.forEach((b, k) => { b.style.transform = `scaleX(${k < pos ? 1 : k === pos ? p : 0})`; });
}
function loop(now) { if (!running) return; paint(now); requestAnimationFrame(loop); }
function start() { if (running || reduce) return; running = true; if (pausedAt) { t0 += performance.now() - pausedAt; pausedAt = 0; } requestAnimationFrame(loop); }
function stop() { if (!running) return; running = false; pausedAt = performance.now(); }
sizeReel();
if (reduce) { setNow(FIRST); coverDraw(rc, STILLS[FIRST], rw, rh, 1.04); segBars[0].style.transform = "scaleX(1)"; }
else { paint(performance.now()); start(); }
addEventListener("resize", () => { sizeReel(); if (reduce) coverDraw(rc, STILLS[FIRST], rw, rh, 1.04); else paint(performance.now()); });
if ("IntersectionObserver" in window) new IntersectionObserver(([e]) => e.isIntersecting ? start() : stop()).observe(reel);
$("reel-btn").addEventListener("click", () => openPlayer(SITE.showreel));

/* ---------- 播放弹层 ---------- */
const modal = $("modal"), stage = $("stage");
let lastFocus = null;
function openPlayer(v) {
  lastFocus = document.activeElement; stage.innerHTML = ""; hidePeek();
  if (v.src) {
    const vd = document.createElement("video");
    vd.src = v.src; vd.controls = true; vd.preload = "metadata"; vd.playsInline = true; if (v.cover) vd.poster = v.cover;
    stage.appendChild(vd);
  } else if (v.bvid || v.qqvid) {
    const f = document.createElement("iframe");
    f.src = v.bvid ? `https://player.bilibili.com/player.html?bvid=${encodeURIComponent(v.bvid)}&p=1&autoplay=0&danmaku=0&high_quality=1`
                   : `https://v.qq.com/txp/iframe/player.html?vid=${encodeURIComponent(v.qqvid)}`;
    f.title = v.title; f.allowFullscreen = true; f.setAttribute("allow", "fullscreen; picture-in-picture"); f.setAttribute("scrolling", "no");
    stage.appendChild(f);
  } else {
    stage.innerHTML = `<div class="ph"><b>这里会直接播放《${v.title}》</b>
      <span>样板里的作品是示例，没有真实视频。正式网站会嵌入 B站 播放器，十几二十分钟的长片也能流畅播放，电脑和手机都能看。</span></div>`;
  }
  $("m-t").innerHTML = `《${v.title}》<i>${v.en || ""} · ${dur(v.runtime)}</i>`;
  $("m-x").innerHTML = v.bvid ? `<a href="https://www.bilibili.com/video/${v.bvid}" target="_blank" rel="noopener">在 B站 打开 ↗</a>` : "";
  modal.hidden = false; document.body.style.overflow = "hidden"; stop(); $("m-close").focus();
}
function closePlayer() {
  modal.hidden = true; stage.innerHTML = ""; document.body.style.overflow = "";
  if (reel.getBoundingClientRect().bottom > 0) start();
  if (lastFocus) lastFocus.focus();
}
$("m-close").addEventListener("click", closePlayer);
modal.addEventListener("click", (e) => { if (e.target === modal) closePlayer(); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.hidden) closePlayer(); });

/* ---------- 复制 ---------- */
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); return "已复制"; }
  catch (e) { const r = document.createRange(); r.selectNodeContents(fallbackEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); return "已选中，按复制即可"; }
}
$("mail").addEventListener("click", async () => {
  $("mail-hint").textContent = (await copyText(SITE.email, $("mail"))) === "已复制" ? "已复制邮箱" : "已选中，按复制即可";
  setTimeout(() => { $("mail-hint").textContent = "点击复制邮箱"; }, 1800);
});
document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
  b.textContent = await copyText(b.dataset.copy, b.previousElementSibling);
  setTimeout(() => { b.textContent = "复制"; }, 1600);
}));
</script>

</body>
