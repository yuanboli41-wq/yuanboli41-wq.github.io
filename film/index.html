/* Layout: 放映厅。整屏真实画面开场 → 片名名单（悬停看画面）→ 代表作虚化特写 → 关于 → 联系。单一深色，颜色只来自画面 */
:root{
  --bg:#0D0C0B;
  --ink:#EDE8E0;
  --ink-2:rgba(237,232,224,.64);
  --ink-3:rgba(237,232,224,.38);
  --rule:rgba(237,232,224,.13);
  --light:#F6F1E8;
  --display:"ZX Serif","Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  --latin:"Instrument Serif","Times New Roman",Georgia,serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --gutter:max(clamp(16px,4.2vw,64px),env(safe-area-inset-left,0px));
  --gutter-r:max(clamp(16px,4.2vw,64px),env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:1.5px solid var(--light);outline-offset:4px}
.in{max-width:1360px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter-r)}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:12px;letter-spacing:.28em;color:var(--ink-3);padding-bottom:16px;border-bottom:1px solid var(--rule)}
.label .n{font-family:var(--latin);font-style:italic;font-size:16px;letter-spacing:.01em;color:var(--ink-2)}

/* ---------- 开场 ---------- */
.hero{position:relative;height:min(100svh,960px);min-height:560px;overflow:hidden;background:#000;color:var(--light)}
.reel{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.slide.on{opacity:1}
.slide video,.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide img{transform:scale(1.03)}
@media (prefers-reduced-motion:no-preference){
  .slide.on img{animation:kb 9s ease-out forwards}
  .grain{animation:grain .6s steps(3) infinite}
}
@keyframes kb{to{transform:scale(1.12) translate(-1.5%,-1%)}}
.grain{position:absolute;inset:-60px;pointer-events:none;opacity:.075;background-image:var(--grain);background-size:180px}
@keyframes grain{33%{transform:translate(-37px,21px)}66%{transform:translate(23px,-41px)}}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,7,6,.62) 0%,rgba(8,7,6,0) 22%,rgba(8,7,6,0) 40%,rgba(8,7,6,.88) 100%)}
.hero .in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding-block:22px clamp(26px,4vw,52px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;font-size:13px;letter-spacing:.08em}
.mark{display:flex;align-items:baseline;gap:12px}
.mark b{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.14em}
.mark span{font-size:11px;color:rgba(246,241,232,.55);letter-spacing:.12em}
.bar nav{display:flex;gap:clamp(18px,3vw,40px)}
.bar nav a{text-decoration:none;color:rgba(246,241,232,.76)}
.bar nav a:hover{color:var(--light)}
.hero-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:28px 48px}
.hero-name{font-family:var(--display);font-weight:900;font-size:clamp(4.4rem,15.5vw,13rem);line-height:.9;letter-spacing:.03em;margin:0;text-shadow:0 4px 60px rgba(0,0,0,.4)}
.hero-sub{margin-top:clamp(14px,2vw,24px);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 20px;font-size:14px;letter-spacing:.1em;color:rgba(246,241,232,.78)}
.hero-sub i{font-family:var(--latin);font-size:19px;letter-spacing:.01em;color:var(--light)}
.now{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:10px;min-width:220px}
.now-k{font-size:11px;letter-spacing:.3em;color:rgba(246,241,232,.55)}
.now-t{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.2;letter-spacing:.04em}
.now-m{font-family:var(--latin);font-style:italic;font-size:18px;color:rgba(246,241,232,.75);line-height:1.2}
.segs{display:flex;gap:6px;width:100%;max-width:240px}
.segs button{flex:1;height:14px;padding:6px 0;background:none;border:0;cursor:pointer}
.segs span{display:block;height:2px;background:rgba(246,241,232,.24);overflow:hidden}
.segs i{display:block;height:100%;background:var(--light);transform-origin:left;transform:scaleX(0)}
.reel-btn{margin-top:6px;display:inline-flex;align-items:center;gap:12px;background:rgba(246,241,232,.08);border:1px solid rgba(246,241,232,.34);border-radius:999px;padding:7px 18px 7px 7px;cursor:pointer;font-size:14px;letter-spacing:.06em;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background .25s}
.reel-btn:hover{background:rgba(246,241,232,.18)}
.reel-btn .dot{width:32px;height:32px;border-radius:50%;background:var(--light);color:#0D0C0B;display:grid;place-items:center}
.reel-btn svg{width:10px;height:10px;margin-left:2px}
.reel-btn em{font-family:var(--latin);font-size:16px;color:rgba(246,241,232,.72)}

/* ---------- 作品名单 ---------- */
.works{padding-block:clamp(80px,11vw,150px) 0}
.index{list-style:none;margin:0;padding:0}
.row{border-bottom:1px solid var(--rule)}
.row-btn{appearance:none;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;width:100%;
  display:grid;grid-template-columns:minmax(0,1fr) 140px 130px 120px;grid-template-areas:"head type role time";
  align-items:center;gap:10px 28px;padding-block:clamp(22px,2.8vw,38px);transition:opacity .4s}
@media (hover:hover){
  .index:hover .row-btn{opacity:.26}
  .index .row-btn:hover,.index .row-btn:focus-visible{opacity:1}
}
.r-head{grid-area:head;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 22px;min-width:0}
.r-title{font-family:var(--display);font-weight:900;font-size:clamp(2.3rem,6.4vw,5.6rem);line-height:1.08;letter-spacing:.04em}
.r-en{font-family:var(--latin);font-style:italic;font-size:clamp(1.05rem,1.7vw,1.45rem);color:var(--ink-2)}
.r-type{grid-area:type;font-size:13px;color:var(--ink-2);letter-spacing:.08em;line-height:1.5}
.r-type small{display:block;font-family:var(--latin);font-size:15px;letter-spacing:.02em;color:var(--ink-3)}
.r-role{grid-area:role;font-size:13px;color:var(--ink-2);letter-spacing:.08em}
.r-time{grid-area:time;font-family:var(--latin);font-size:clamp(1.4rem,2.1vw,1.9rem);text-align:right;font-variant-numeric:tabular-nums}
.thumb{grid-area:thumb;display:none;position:relative;aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.peek{position:fixed;left:0;top:0;z-index:30;width:clamp(260px,25vw,400px);aspect-ratio:16/9;pointer-events:none;overflow:hidden;background:#000;
  opacity:0;transform:translate3d(var(--x,-999px),var(--y,-999px),0) translate(-50%,-50%) scale(.94);transition:opacity .25s;
  box-shadow:0 30px 90px rgba(0,0,0,.65)}
.peek.on{opacity:1;transform:translate3d(var(--x),var(--y),0) translate(-50%,-50%) scale(1)}
.peek img{width:100%;height:100%;object-fit:cover;display:block}
.peek span{position:absolute;left:12px;bottom:10px;font-family:var(--latin);font-style:italic;font-size:15px;color:var(--light);text-shadow:0 1px 10px rgba(0,0,0,.7)}

/* ---------- 代表作 ---------- */
.feature{position:relative;overflow:hidden;margin-top:clamp(80px,11vw,150px);background:#000;color:var(--light)}
.f-bg{position:absolute;inset:-12%}
.f-bg img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(46px) saturate(1.1);opacity:.75}
.feature::after{content:"";position:absolute;inset:0;background:rgba(13,12,11,.45);pointer-events:none}
.feature .in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:40px clamp(36px,5.5vw,96px);padding-block:clamp(64px,9vw,130px)}
.f-frame{position:relative;aspect-ratio:2.39/1;max-width:100%;overflow:hidden;background:#000;box-shadow:0 40px 120px rgba(0,0,0,.55);cursor:pointer;border:0;padding:0;display:block;width:100%}
.f-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s ease}
.f-frame:hover img{transform:scale(1.03)}
.f-frame .ratio{position:absolute;top:12px;right:14px;font-family:var(--latin);font-size:14px;color:rgba(246,241,232,.75)}
.f-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(246,241,232,.6);background:rgba(246,241,232,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .3s,background .3s}
.f-play svg{width:14px;height:14px;margin-left:3px}
.f-frame:hover .f-play{transform:translate(-50%,-50%) scale(1.08);background:rgba(246,241,232,.22)}
.f-k{font-size:12px;letter-spacing:.28em;color:rgba(246,241,232,.62)}
.f-title{font-family:var(--display);font-weight:900;font-size:clamp(3.2rem,7.4vw,6.6rem);line-height:1;letter-spacing:.04em;margin:18px 0 8px}
.f-en{font-family:var(--latin);font-style:italic;font-size:clamp(1.25rem,2vw,1.7rem);color:rgba(246,241,232,.8)}
.f-log{margin:24px 0 26px;max-width:24em;color:rgba(246,241,232,.84);font-size:16px}
.f-credits{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 28px;margin:0;font-size:14px}
.f-credits dt{color:rgba(246,241,232,.52);letter-spacing:.14em}
.f-credits dd{margin:0}
.f-credits .lat{font-family:var(--latin);font-size:17px;line-height:1.4}
.f-award{margin-top:26px;display:flex;gap:12px;align-items:baseline;font-size:13px;color:rgba(246,241,232,.78)}
.f-award b{flex:none;font-weight:500;font-size:11px;letter-spacing:.2em;border:1px solid rgba(246,241,232,.45);padding:1px 7px;border-radius:2px}

/* ---------- 关于 ---------- */
.about{padding-block:clamp(80px,11vw,150px) 0}
.statement{font-family:var(--display);font-weight:500;font-size:clamp(1.6rem,3.5vw,2.85rem);line-height:1.55;letter-spacing:.03em;max-width:21em;margin:clamp(32px,5vw,64px) 0 clamp(56px,7vw,96px);text-wrap:pretty}
.statement em{font-style:normal;font-weight:900}
.about-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px clamp(28px,4vw,64px)}
.about-grid h3{margin:0 0 14px;font-size:12px;font-weight:400;letter-spacing:.28em;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 22px;margin:0;font-size:14px}
.kv dt{color:var(--ink-3);letter-spacing:.08em}
.kv dd{margin:0;color:var(--ink)}
.cv{list-style:none;margin:0;padding:0}
.cv li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 16px;padding-block:9px;border-top:1px solid var(--rule);font-size:14px}
.cv li:first-child{border-top:0;padding-top:0}
.cv .y{font-family:var(--latin);font-size:17px;color:var(--ink-2);line-height:1.5}
.cv .r{display:block;color:var(--ink-3);font-size:13px}

/* ---------- 联系 ---------- */
.contact{padding-block:clamp(80px,11vw,150px) clamp(48px,6vw,80px)}
.mail{appearance:none;background:none;border:0;padding:0;cursor:pointer;text-align:left;display:block;margin-top:clamp(30px,4.5vw,56px);
  font-family:var(--latin);font-size:clamp(2rem,6.6vw,5.8rem);line-height:1.08;letter-spacing:-.005em;overflow-wrap:anywhere;transition:color .25s}
.mail:hover{color:var(--light)}
.mail-hint{margin-top:12px;font-size:13px;color:var(--ink-3);letter-spacing:.08em;min-height:1.6em}
.c-list{margin-top:clamp(36px,5vw,64px);display:flex;flex-wrap:wrap;gap:16px clamp(32px,6vw,96px)}
.c-item{display:flex;align-items:baseline;gap:16px}
.c-item .k{font-size:12px;letter-spacing:.24em;color:var(--ink-3)}
.c-item .v{font-size:17px;letter-spacing:.04em}
.copy{appearance:none;background:none;border:1px solid var(--rule);border-radius:999px;padding:2px 12px;font-size:12px;color:var(--ink-2);cursor:pointer;letter-spacing:.06em}
.copy:hover{border-color:var(--ink-2);color:var(--ink)}
footer .in{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding-block:22px 36px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3);letter-spacing:.04em}

/* ---------- 播放弹层 ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,5,4,.94);display:grid;place-items:center;
  padding-top:calc(env(safe-area-inset-top,0px) + 64px);padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.m-inner{width:min(1180px,100%)}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;overflow:hidden}
.stage iframe,.stage video,.stage>img{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:cover}
.stage>img{opacity:.35}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;padding:24px;color:var(--light)}
.ph b{font-family:var(--display);font-weight:900;font-size:clamp(1.3rem,3vw,2rem);letter-spacing:.04em}
.ph span{font-size:14px;color:rgba(246,241,232,.7);max-width:30em}
.m-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-top:14px;color:var(--light)}
.m-cap .t{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.04em}
.m-cap .t i{font-family:var(--latin);font-weight:400;font-size:17px;margin-left:12px;color:rgba(246,241,232,.62)}
.m-cap a{font-size:13px;color:rgba(246,241,232,.62)}
.m-close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));background:none;border:1px solid rgba(246,241,232,.35);color:var(--light);border-radius:999px;padding:5px 16px;font-size:13px;letter-spacing:.1em;cursor:pointer}

@media (max-width:860px){
  .row-btn{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"thumb thumb thumb" "head head head" "type role time";gap:12px 18px;padding-block:28px}
  .thumb{display:block}
  .r-type small{display:inline;margin-left:6px}
  .r-time{font-size:1.4rem}
  .feature .in{grid-template-columns:1fr}
  .about-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:620px){
  .hero{height:min(100svh,780px)}
  .hero-foot{grid-template-columns:1fr}
  .now{align-items:flex-start;text-align:left;min-width:0}
  .segs{max-width:none}
  .about-grid{grid-template-columns:1fr}
  .bar nav{gap:16px}
}
</style>
</head>
<body>


<header class="hero" id="top">
  <div class="reel" id="reel" aria-hidden="true"></div>
  <div class="grain" id="grain" aria-hidden="true"></div>
  <div class="in">
    <div class="bar">
      <div class="mark"><b id="s-mark"></b><span>样板 · 人物与作品均为示例</span></div>
      <nav aria-label="页面导航"><a href="#works">作品</a><a href="#about">关于</a><a href="#contact">联系</a></nav>
    </div>

      <div>
        <h1 class="hero-name" id="s-name"></h1>

        <button class="reel-btn" type="button" id="reel-btn"><span class="dot"><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0L10 6L0 12Z" fill="currentColor"/></svg></span>作品合集 <em id="reel-len"></em></button>
      </div>

</header>

<main>
  <section class="works" id="works">
    <div class="in">
      <div class="label"><span>作品</span><span class="n" id="works-sum"></span></div>
      <ul class="index" id="index"></ul>
    </div>
  </section>

  <section class="feature" id="feature" aria-label="代表作">
    <div class="f-bg"><img id="f-bg" alt="" loading="lazy"></div>
    <div class="in">
      <button class="f-frame" type="button" id="f-frame">
        <img id="f-img" alt="" loading="lazy">
        <span class="ratio" id="f-ratio"></span>
        <span class="f-play"><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0L10 6L0 12Z" fill="currentColor"/></svg></span>
      </button>
      <div>
        <div class="f-k" id="f-k"></div>
        <h2 class="f-title" id="f-title"></h2>
        <div class="f-en" id="f-en"></div>
        <p class="f-log" id="f-log"></p>
        <dl class="f-credits" id="f-credits"></dl>

      </div>
    </div>

  <section class="about" id="about">
    <div class="in">
      <div class="label"><span>关于</span><span class="n">About</span></div>

        <div><h3>基本信息</h3><dl class="kv" id="s-facts"></dl></div>
        <div><h3>经历</h3><ul class="cv" id="s-cv"></ul></div>

</main>

<footer><div class="in"><span id="s-copy"></span><span>示例画面来自 Pexels、Unsplash 免费素材 · 影片通过 B站 播放器嵌入</span></div></footer>

<div class="peek" id="peek" aria-hidden="true"><img id="peek-img" alt=""><span id="peek-t"></span></div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="m-t">
  <button class="m-close" type="button" id="m-close">关闭</button>
  <div class="m-inner">
    <div class="stage" id="stage"></div>
    <div class="m-cap"><span class="t" id="m-t"></span><span id="m-x"></span></div>
  </div>
</div>

<script>
/* ===== 改这里就能换成客户自己的内容 =====
   still：剧照（横版 1920×1080 最好）；thumb：小图（640×360），不填就用 still。
   clip：开场用的几秒短片段（不带后缀，准备 名字-1080.mp4 和 名字-720.mp4 两个文件），不填就用剧照慢推。
   正片三选一：bvid 填 B站视频编号（BV 开头）；qqvid 填腾讯视频编号；src 填自己托管的 mp4 地址。
   feature：“代表作”区块用第几部（从 0 开始数）。 */
const SITE = {
  name: "林知夏",
  roles: "导演 · 剪辑",
  enRoles: "Director & Editor",
  city: "郑州",
  statement: "偏爱现实题材，镜头对准身边的普通人。<em>从前期拍摄到剪辑、调色，都能独立完成。</em>",
  showreel: { title: "作品合集", en: "Showreel 2026", runtime: "00:01:30", bvid: "", still: "media/rain.jpg" },
  feature: 2,
  works: [
    { title:"回南天", en:"Damp Spring", type:"剧情短片", year:2025, runtime:"00:24:18", ratio:"2.39:1", role:"导演 / 编剧",
      log:"南方返潮的三月，一对很久不说话的父女，被困在同一间漏水的出租屋里。",
      still:"media/rain.jpg", thumb:"media/rain-640.jpg", clip:"media/rain", bvid:"" },
    { title:"第七站", en:"The Seventh Stop", type:"剧情短片", year:2025, runtime:"00:17:42", ratio:"16:9", role:"导演 / 剪辑",
      log:"末班公交上，司机和唯一的乘客，都在等对方先开口。",
      still:"media/bus.jpg", thumb:"media/bus-640.jpg", clip:"", bvid:"" },
    { title:"守灯人", en:"The Keeper", type:"纪录短片", year:2024, runtime:"00:21:05", ratio:"2.39:1", role:"导演 / 摄影",
      log:"海边一座停用的航标塔，最后一位看守人的四季。",
      credits:[["导演","林知夏"],["摄影","林知夏"],["剪辑","周屿（示例）"]],
      award:["展映","青年影像周 · 纪录单元（示例）"],
      still:"media/lighthouse.jpg", thumb:"media/lighthouse-640.jpg", clip:"media/lighthouse", bvid:"" },
    { title:"夜班", en:"Night Shift", type:"实验短片", year:2024, runtime:"00:05:12", ratio:"16:9", role:"剪辑 / 调色",
      log:"便利店凌晨三点到六点，一个机位，一场雨。",
      still:"media/store.jpg", thumb:"media/store-640.jpg", clip:"media/store", bvid:"" }
  ],
  facts: [["方向","剧情短片 · 人物纪录片"],["所在","河南 郑州"],["状态","求职中，可实习"]],
  cv: [["2025","某影视文化公司后期部（示例）","剪辑实习"],["2025","毕业作品《回南天》","导演 / 编剧"],["2024","校园电视台","摄像 / 剪辑"],["2023","纪录片工作坊","学员"]],
  skills: [["剪辑","Premiere Pro · Final Cut Pro"],["调色","DaVinci Resolve"],["包装","After Effects"],["拍摄","Sony FX3 · 大疆如影"]],
  email: "linzhixia.film@example.com",
  contact: [["电话","138 0000 0000"],["微信","同手机号"]]
};

/* ===== 页面逻辑，一般不用改 ===== */
const $ = (id) => document.getElementById(id);
const toSec = (t) => t.split(":").map(Number).reduce((a, n) => a * 60 + n, 0);
const dur = (t) => { const s = toSec(t), m = Math.floor(s / 60); return `${m}’${String(s % 60).padStart(2, "0")}”`; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const W = SITE.works, N = W.length;

/* 胶片颗粒（运行时生成一张小噪点图） */
(function () {
  const g = document.createElement("canvas"); g.width = g.height = 180;
  const gc = g.getContext("2d"), d = gc.createImageData(180, 180);
  for (let p = 0; p < d.data.length; p += 4) { const v = Math.random() * 255; d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255; }
  gc.putImageData(d, 0, 0);
  $("grain").style.setProperty("--grain", `url(${g.toDataURL()})`);
})();

/* ---------- 文字内容 ---------- */
$("s-mark").textContent = SITE.name;
$("s-name").textContent = SITE.name;
$("s-sub").innerHTML = `<span>${SITE.roles}</span><i>${SITE.enRoles}</i><span>${SITE.city}</span>`;
$("reel-len").textContent = dur(SITE.showreel.runtime);
$("s-statement").innerHTML = SITE.statement;
$("s-facts").innerHTML = SITE.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
$("s-skills").innerHTML = SITE.skills.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
$("s-cv").innerHTML = SITE.cv.map(([y, w, r]) => `<li><span class="y">${y}</span><span>${w}<span class="r">${r}</span></span></li>`).join("");
$("mail").textContent = SITE.email;
$("c-list").innerHTML = SITE.contact.map(([k, v], i) =>
  `<div class="c-item"><span class="k">${k}</span><span class="v" id="cv-${i}">${v}</span><button class="copy" type="button" data-copy="${v}">复制</button></div>`).join("");
$("s-copy").textContent = `© ${new Date().getFullYear()} ${SITE.name} · 样板网站，人物和作品均为示例`;
$("works-sum").textContent = `${N} works · ${Math.round(W.reduce((a, w) => a + toSec(w.runtime), 0) / 60)} min`;

/* ---------- 作品名单 ---------- */
const index = $("index");
W.forEach((w, i) => {
  const li = document.createElement("li"); li.className = "row";
  li.innerHTML = `<button class="row-btn" type="button" aria-label="播放《${w.title}》，${w.type}，${w.year}">
      <span class="thumb"><img src="${w.thumb || w.still}" alt="" loading="lazy" decoding="async"></span>
      <span class="r-head"><span class="r-title">${w.title}</span><span class="r-en">${w.en}</span></span>
      <span class="r-type">${w.type}<small>${w.year}</small></span>
      <span class="r-role">${w.role}</span>
      <span class="r-time">${dur(w.runtime)}</span>
    </button>`;
  index.appendChild(li);
  const b = li.querySelector(".row-btn");
  b.addEventListener("click", () => openPlayer(w));
  b.addEventListener("mouseenter", () => showPeek(i));
  b.addEventListener("focus", () => showPeek(i, b));
  b.addEventListener("blur", hidePeek);
});
index.addEventListener("mouseleave", hidePeek);

/* 跟随鼠标的预览画面（只在有鼠标的设备上） */
const peek = $("peek"), finePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;
let px = -999, py = -999, tx = -999, ty = -999;
if (finePointer) W.forEach(w => { const im = new Image(); im.src = w.thumb || w.still; });
function showPeek(i, anchor) {
  if (!finePointer) return;
  $("peek-img").src = W[i].thumb || W[i].still; $("peek-t").textContent = W[i].en;
  if (anchor) { const rc = anchor.getBoundingClientRect(); tx = px = rc.left + rc.width * .62; ty = py = rc.top + rc.height / 2; }
  peek.classList.add("on");
}
function hidePeek() { peek.classList.remove("on"); }
if (finePointer) {
  addEventListener("mousemove", (e) => { tx = e.clientX + 30; ty = e.clientY; if (px < -900) { px = tx; py = ty; } });
  const follow = () => {
    const k = reduce ? 1 : .16; px += (tx - px) * k; py += (ty - py) * k;
    peek.style.setProperty("--x", px + "px"); peek.style.setProperty("--y", py + "px");
    requestAnimationFrame(follow);
  };
  requestAnimationFrame(follow);
}

/* ---------- 代表作 ---------- */
const F = W[SITE.feature] || W[0];
$("f-img").src = F.still; $("f-bg").src = F.thumb || F.still;
$("f-k").textContent = `代表作 · ${F.type} · ${F.year}`;
$("f-title").textContent = F.title;
$("f-en").textContent = F.en;
$("f-log").textContent = F.log;
$("f-ratio").textContent = F.ratio;
$("f-credits").innerHTML = (F.credits || [["职务", F.role]]).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")
  + `<dt>时长</dt><dd class="lat">${dur(F.runtime)}</dd><dt>画幅</dt><dd class="lat">${F.ratio}</dd>`;
if (F.award) $("f-award").innerHTML = `<b>${F.award[0]}</b><span>${F.award[1]}</span>`; else $("f-award").hidden = true;
$("f-frame").setAttribute("aria-label", `播放《${F.title}》`);
$("f-frame").addEventListener("click", () => openPlayer(F));

/* ---------- 开场：真实画面轮播（有短片段就播片段，没有就剧照慢推） ---------- */
const HD = innerWidth > 900 && Math.max(screen.width, screen.height) * (devicePixelRatio || 1) > 1500;
const reelEl = $("reel"), DUR = 7000;
const slides = W.map((w, i) => {
  const s = document.createElement("div"); s.className = "slide";
  if (w.clip && !reduce) {
    const v = document.createElement("video");
    v.muted = true; v.defaultMuted = true; v.playsInline = true; v.loop = true;
    v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", "");
    v.preload = i === 0 ? "auto" : "none"; v.poster = w.still; v.src = `${w.clip}-${HD ? 1080 : 720}.mp4`;
    s.appendChild(v);
  } else {
    const im = new Image(); im.alt = ""; im.decoding = "async"; im.src = w.still; s.appendChild(im);
  }
  reelEl.appendChild(s); return s;
});
const segs = $("segs");
segs.innerHTML = W.map((w, i) => `<button type="button" aria-label="切换到《${w.title}》"><span><i></i></span></button>`).join("");
const segBtns = [...segs.querySelectorAll("button")], segBars = segBtns.map(b => b.querySelector("i"));
let cur = -1, startAt = 0, running = false, pausedAt = 0;
function setNow(i) { $("now-t").textContent = `《${W[i].title}》`; $("now-m").textContent = `${W[i].en} · ${dur(W[i].runtime)}`; }
function playVid(v) { if (!v) return; try { v.currentTime = 0; } catch (e) {} const p = v.play(); if (p && p.catch) p.catch(() => {}); }
function go(i) {
  const prev = cur; cur = i;
  slides.forEach((s, k) => s.classList.toggle("on", k === i));
  const im = slides[i].querySelector("img"); if (im) { im.style.animation = "none"; void im.offsetWidth; im.style.animation = ""; }
  if (running || reduce === false) playVid(slides[i].querySelector("video"));
  if (prev >= 0 && prev !== i) { const pv = slides[prev].querySelector("video"); if (pv) setTimeout(() => { if (cur !== prev) pv.pause(); }, 1500); }
  const nv = slides[(i + 1) % N].querySelector("video"); if (nv && nv.preload !== "auto") { nv.preload = "auto"; nv.load(); }
  setNow(i); startAt = performance.now();
  segBars.forEach((b, k) => { b.style.transform = `scaleX(${k < i ? 1 : 0})`; });
}
function tick(now) {
  if (!running) return;
  const p = (now - startAt) / DUR;
  segBars[cur].style.transform = `scaleX(${Math.min(p, 1)})`;
  if (p >= 1) go((cur + 1) % N);
  requestAnimationFrame(tick);
}
function start() {
  if (running || reduce) return; running = true;
  if (pausedAt) { startAt += performance.now() - pausedAt; pausedAt = 0; const v = slides[cur].querySelector("video"); if (v) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } }
  requestAnimationFrame(tick);
}
function stop() { if (!running) return; running = false; pausedAt = performance.now(); const v = slides[cur] && slides[cur].querySelector("video"); if (v) v.pause(); }
segBtns.forEach((b, k) => b.addEventListener("click", () => { go(k); }));
go(0);
if (reduce) { segBars[0].style.transform = "scaleX(1)"; } else start();
if ("IntersectionObserver" in window) new IntersectionObserver(([e]) => e.isIntersecting ? start() : stop()).observe(reelEl);
document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
$("reel-btn").addEventListener("click", () => openPlayer(SITE.showreel));

/* ---------- 播放弹层 ---------- */
const modal = $("modal"), stage = $("stage");
let lastFocus = null;
function openPlayer(v) {
  lastFocus = document.activeElement; stage.innerHTML = ""; hidePeek();
  if (v.src) {
    const vd = document.createElement("video");
    vd.src = v.src; vd.controls = true; vd.preload = "metadata"; vd.playsInline = true; if (v.still) vd.poster = v.still;
    stage.appendChild(vd);
  } else if (v.bvid || v.qqvid) {
    const f = document.createElement("iframe");
    f.src = v.bvid ? `https://player.bilibili.com/player.html?bvid=${encodeURIComponent(v.bvid)}&p=1&autoplay=0&danmaku=0&high_quality=1`
                   : `https://v.qq.com/txp/iframe/player.html?vid=${encodeURIComponent(v.qqvid)}`;
    f.title = v.title; f.allowFullscreen = true; f.setAttribute("allow", "fullscreen; picture-in-picture"); f.setAttribute("scrolling", "no");
    stage.appendChild(f);
  } else {
    stage.innerHTML = `${v.still ? `<img src="${v.still}" alt="">` : ""}<div class="ph"><b>这里会直接播放《${v.title}》</b>
      <span>样板里的作品是示例，没有真实正片。正式网站会嵌入 B站 播放器，十几二十分钟的长片也能流畅播放，电脑和手机都能看。</span></div>`;
  }
  $("m-t").innerHTML = `《${v.title}》<i>${v.en || ""} · ${dur(v.runtime)}</i>`;
  $("m-x").innerHTML = v.bvid ? `<a href="https://www.bilibili.com/video/${v.bvid}" target="_blank" rel="noopener">在 B站 打开 ↗</a>` : "";
  modal.hidden = false; document.body.style.overflow = "hidden"; stop(); $("m-close").focus();
}
function closePlayer() {
  modal.hidden = true; stage.innerHTML = ""; document.body.style.overflow = "";
  if (reelEl.getBoundingClientRect().bottom > 0) start();
  if (lastFocus) lastFocus.focus();
}
$("m-close").addEventListener("click", closePlayer);
modal.addEventListener("click", (e) => { if (e.target === modal) closePlayer(); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.hidden) closePlayer(); });

/* ---------- 复制 ---------- */
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); return "已复制"; }
  catch (e) { const r = document.createRange(); r.selectNodeContents(fallbackEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); return "已选中，按复制即可"; }
}
$("mail").addEventListener("click", async () => {
  $("mail-hint").textContent = (await copyText(SITE.email, $("mail"))) === "已复制" ? "已复制邮箱" : "已选中，按复制即可";
  setTimeout(() => { $("mail-hint").textContent = "点击复制邮箱"; }, 1800);
});
document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
  b.textContent = await copyText(b.dataset.copy, b.previousElementSibling);
  setTimeout(() => { b.textContent = "复制"; }, 1600);
}));
</script>
